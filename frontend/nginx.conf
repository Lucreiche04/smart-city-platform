server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Fichiers avec hash dans le nom : cache long
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    # Routage côté client (React Router) : toute URL renvoie index.html
    location / {
        try_files $uri /index.html;
    }
}
