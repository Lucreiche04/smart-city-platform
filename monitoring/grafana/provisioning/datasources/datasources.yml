apiVersion: 1
datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    url: http://prometheus:9090
    isDefault: true
  - name: SmartCityDB
    uid: smartcitydb
    type: postgres
    url: db:5432
    user: ${POSTGRES_USER}
    jsonData:
      database: ${POSTGRES_DB}
      sslmode: disable
      timescaledb: true
      postgresVersion: 1600
    secureJsonData:
      password: ${POSTGRES_PASSWORD}
